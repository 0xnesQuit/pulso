name: Freeband
options:
  bundleIdPrefix: dev.cobanov
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 6U58AKY6F8
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Freeband:
    type: application
    platform: iOS
    sources:
      - path: Freeband
        excludes:
          - "**/*.old"
    info:
      path: Freeband/Info.plist
      properties:
        CFBundleDisplayName: Freeband
        UIUserInterfaceStyle: Dark
        UIAppFonts: [DepartureMono-Regular.otf]
        CFBundleDevelopmentRegion: tr
        CFBundleLocalizations: [tr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: Freeband bileğindeki bantla doğrudan konuşmak için Bluetooth kullanır.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [bluetooth-le]
        CFBundleURLTypes:
          - CFBundleURLName: dev.cobanov.freeband
            CFBundleURLSchemes: [freeband]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cobanov.freeband
        PRODUCT_NAME: Freeband
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
