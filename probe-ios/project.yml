name: BandProbe
options:
  bundleIdPrefix: dev.cobanov
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 6U58AKY6F8
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  BandProbe:
    type: application
    platform: iOS
    sources: [BandProbe]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cobanov.bandprobe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BandProbe
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Bilekliğin GATT servislerini salt okunur listelemek için."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.3"
        CURRENT_PROJECT_VERSION: "5"
